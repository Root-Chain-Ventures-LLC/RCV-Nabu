# Template only: do not commit real values. Create the live Secret out of band, e.g.
#
#   kubectl -n nabu create secret generic nabu \
#     --from-literal=DATABASE_URL="postgres://nabu:<password>@<postgres-host>:5432/nabu" \
#     --from-literal=NABU_SECRET_KEY="$(openssl rand -base64 32)"
#
# DATABASE_URL and NABU_SECRET_KEY are the two required secrets.
#
# NABU_SECRET_KEY (32 bytes, base64 or 64 hex characters) is the master key that encrypts every
# secret an administrator saves in Settings (SMTP password, AI provider keys, SSO client
# secret) before it is written to Postgres. The app refuses to start without it. Losing it
# makes those stored secrets unrecoverable (re-enter them in Settings); back it up, in a
# different place from your database backups. To rotate it, put the old value in
# NABU_SECRET_KEY_PREVIOUS (comma-separated if there are several) next to the new one; see
# deploy/README.md.
#
# Sessions are opaque random tokens stored (hashed) in Postgres, so there is no session-signing
# key to set or to share between replicas.
apiVersion: v1
kind: Secret
metadata:
  name: nabu
  labels:
    app.kubernetes.io/name: nabu
type: Opaque
stringData:
  DATABASE_URL: ""
  NABU_SECRET_KEY: ""
