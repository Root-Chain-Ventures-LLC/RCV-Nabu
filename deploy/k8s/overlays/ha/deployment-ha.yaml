# Strategic-merge patch over base/deployment.yaml. The base's `strategy: Recreate` exists only
# because one replica writes DATA_DIR onto a ReadWriteOnce volume; pvc-rwx.yaml removes that
# constraint (ReadWriteMany), so a RollingUpdate is safe here: old and new pods can both hold the
# volume open while the rollout proceeds. `maxUnavailable: 0` means the rollout never drops below
# the desired number of ready pods; `maxSurge: 1` adds one extra pod at a time (so a rollout
# briefly runs replicas + 1 pods: the cluster needs room for one more).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nabu
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      # Spread the replicas over different nodes when the cluster can, so one node failing costs
      # one pod. This is a preference, not a rule: a hard "required" rule would leave the surge pod
      # of a rolling update Pending on a cluster with exactly as many schedulable nodes as
      # replicas (the old pods still occupy every node), and the rollout would stall. With the
      # preference, the scheduler spreads the pods whenever there is room and stacks them only
      # when there is not. Pairs with the PodDisruptionBudget (pdb.yaml).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nabu
